name: meetngo_driver
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  mng_core:
    path: ../../packages/mng_core
  # Pinned to 5.x deliberately. All of 2.x predates null safety and cannot
  # resolve on Dart 3. 5.x is a rewrite. ScreenUtilInit(designSize: ...) is the
  # recommended bootstrap. ScreenUtil.init(context, designSize: ...) still
  # exists in 5.x. The real 2.x trap: .sm is deprecated, use .spMin.
  # See the "Screenutil is pinned to 5.x" section of README.md.
  flutter_screenutil: ^5.9.3
  # Auth, Realtime and Edge Functions. `google_maps_flutter` and `url_launcher`
  # are not dependencies of this app: nothing imports them, and the two buttons
  # that would have used `url_launcher` (`navigateButton`, `callRiderButton`)
  # say so on the screen instead of opening a dead link. `image_picker` is the
  # only capture seam; see `lib/src/onboarding/document_scanner_stub.dart`.
  supabase_flutter: ^2.4.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  # The map, on purpose OpenStreetMap raster tiles and not Google Maps.
  # `google_maps_flutter` needs an API key, and an API key with Maps SDK for
  # Android enabled is billed to a card. OSM's public tile servers need no key,
  # no account and no billing, which is the only kind of thing this pilot can
  # afford. `flutter_map` draws OpenStreetMap tiles; `latlong2` is its
  # `LatLng` type, and `mng_core`'s `GeoPoint` is converted at the widget edge
  # rather than in the shared package.
  # 3D map. MapLibre GL plus OpenFreeMap's free vector tiles: real building
  # extrusions, pitch and bearing, with no API key, no account and no card.
  # Google Maps would give the same 3D and needs an API key on a
  # billing-enabled project, which is the one thing this repo avoids.
  #
  # `flutter_map` and `latlong2` were dependencies until the 3D swap and are now
  # gone: `flutter_map` has no pitch and no building extrusions, so it cannot
  # draw 3D at all, and nothing imports either any more. `LatLng` now comes from
  # `maplibre_gl`, which re-exports the same `latlong2` type.
  maplibre_gl: ^0.27.1
  camera: ^0.12.1

  # Face detection for the liveness check, and the anti-spoof model itself.
  #
  # This replaced `google_mlkit_face_detection`, which is not a preference.
  # `detector.processImage` threw a NullPointerException out of Google's own
  # pre-obfuscated runtime on every single frame on the test phone: through the
  # plugin on two versions, through both of its input paths, and through a
  # thirty-line MethodChannel calling the same native API directly. The throw
  # was one layer below `InputImage`, in code no caller controls. So the check
  # could not run, and a required check that cannot run blocks every driver.
  #
  # `face_detection_tflite` is MediaPipe's models on LiteRT, Apache 2.0, bundled
  # in the APK, with no model download and no network. It is documented as
  # ML Kit compatible and its sign conventions match, which is why
  # `LivenessVerifier` needed no change at all: the same
  # `headEulerAngleX/Y/Z`, the same smile and per-eye open probabilities, the
  # same named contours. It is also about 5.5x faster than ML Kit, and it runs
  # on a background isolate, so the live preview keeps moving.
  face_detection_tflite: ^6.10.1
  # The LiteRT runtime behind it, named explicitly because the liveness code
  # loads the anti-spoof model through the interpreter API directly. Both
  # packages are by the same publisher and this is a transitive dependency of
  # the other; it is here so the intent is visible rather than implied.
  flutter_litert: ^3.9.3
  # JPEG decode, for cropping the face region the anti-spoof model needs.
  # `face_detection_tflite` brings OpenCV, but reaching into its internals for
  # a decode is worse than using the one package whose whole job is decoding.
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # The anti-spoof model. 1.85 MB, and the single largest asset in the app.
  #
  # MiniFASNet, from minivision-ai/Silent-Face-Anti-Spoofing, Apache 2.0, which
  # is a licence that permits commercial use and is why this is in a pilot that
  # cannot afford a vendor's per-check fee. It is the whole anti-spoofing half
  # of the face check: a small convolutional network that takes an 80x80 crop of
  # a face and says whether it is a live person or a printed photograph or a
  # phone screen.
  #
  # Bundled rather than fetched, for the same reason the map style is: a driver
  # in a vehicle on a bad connection gets a check that cannot start, and the
  # place that happens is exactly where the check is most needed.
  assets:
    - assets/models/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
