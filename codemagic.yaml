# Codemagic build for the Meet 'N Go phone pilot.
#
# This is a second, independent build path, not a replacement for
# .github/workflows/ci.yml. GitHub Actions refuses to start a job on the build
# account because of a billing lock, and a payment card is not something this
# project will put on the line for two APKs. Codemagic's free tier asks for no
# payment method.
#
# What it produces: two APKs built from the same commits with the same
# --dart-define flags as the GitHub job. Signing already uses the Android debug
# key (apps/rider/android/app/build.gradle.kts), so no keystore is needed and
# the only two values to supply are the public Supabase ones.
#
# Set these as Codemagic environment variables, not in this file:
#   SB_URL  = https://<project-ref>.supabase.co
#   SB_KEY  = the project's anon (publishable) key
# Both are baked into the APK by --dart-define at compile time. The anon key is
# designed to ship inside the app: every read it authorises is already filtered
# by the row level security policies in the migration, and the service-role key
# is never read by either app. A build with neither value still succeeds and
# launches into a screen naming the two missing values, so the build step warns
# rather than fails.
#
# There is deliberately no `environment:` block. Codemagic rejects `cloud`,
# `linux_image` and `instance_type` on this plan, and Linux is the default, so
# omitting the block is both correct and the cheaper machine class.

workflows:
  android-release:
    name: Meet 'N Go — both APKs
    max_build_duration: 60
    # No `config:` block. Codemagic rejects it at the workflow level — the
    # Flutter version is a project-wide setting chosen in the web interface
    # (Project settings -> Flutter), not something a workflow may pin. The
    # machine ships a recent stable, and the test suites below run against
    # whatever it is, so a newer Flutter that changes a lint or a widget's
    # behaviour surfaces as a red step rather than as a silently different APK.
    scripts:
      - name: Install Flutter 3.47.5
        script: |
          set -e
          # Codemagic's image ships a Flutter whose Dart is too old for this
          # code: mng_core declares `sdk: ^3.13.4` and the image has 3.12.2,
          # so `flutter pub get` cannot resolve. Codemagic pins the Flutter
          # version in the web interface rather than in this file, and the
          # version this project was written and tested against is not one
          # that interface offers, so the SDK is installed here instead.
          #
          # 3.47.5 is the current stable and ships Dart 3.13.4, which is the
          # version the suites below are written against.
          FLUTTER_VERSION=3.47.5
          ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}"
          echo "Installing Flutter $FLUTTER_VERSION from $URL"
          curl -fL --retry 3 -o "/tmp/$ARCHIVE" "$URL"
          rm -rf "$HOME/flutter"
          tar -xf "/tmp/$ARCHIVE" -C "$HOME"
          rm -f "/tmp/$ARCHIVE"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --no-analytics > /dev/null
          flutter --version

      - name: Accept the Android SDK licences
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter doctor -v 2>&1 | head -20

      # The same gates, in the same order, as the `verify` job in
      # .github/workflows/ci.yml, so a red suite here means what it means
      # there. An APK that installs and then fails on a phone is harder to
      # debug than a red build.
      - name: Core package
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd packages/mng_core
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Rider app — analyse and test
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd apps/rider
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Driver app — analyse and test
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd apps/driver
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Edge function tests
        script: |
          # The Edge functions are already deployed and a full ride has been
          # run against the live project, so these are a regression gate
          # rather than a first run. Codemagic's Linux image does not
          # necessarily ship Deno, hence the install.
          curl -fsSL https://deno.land/install.sh | sh > /dev/null
          export PATH="$HOME/.deno/bin:$PATH"
          cd supabase
          deno test --allow-env --allow-read=functions/ functions/_tests/

      - name: Build both release APKs
        script: |
          set -e
          export PATH="$HOME/flutter/bin:$PATH"
          if [ -z "${SB_URL:-}" ] || [ -z "${SB_KEY:-}" ]; then
            echo "::warning::SB_URL or SB_KEY is not set; the APKs will build"
            echo "::warning::but launch into the 'not configured' screen."
          fi
          mkdir -p dist
          cd apps/rider
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SB_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SB_KEY:-}"
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/rider-release.apk
          cd ../../apps/driver
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SB_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SB_KEY:-}"
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/driver-release.apk
          cd ../..
          ls -lh dist/

    # Codemagic takes artifact paths as plain strings relative to the repo
    # root. The older `{path:, type:}` object form is rejected.
    artifacts:
      - dist/rider-release.apk
      - dist/driver-release.apk
