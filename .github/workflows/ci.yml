name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Supabase CLI
        run: curl -sSfL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin
      - name: Install Deno
        run: curl -fsSL https://deno.land/install.sh | sh
      - name: Core package
        working-directory: packages/mng_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Rider app
        working-directory: apps/rider
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Driver app
        working-directory: apps/driver
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Edge function tests
        if: ${{ !cancelled() && hashFiles('supabase/functions/_tests/**') != '' }}
        working-directory: supabase
        run: deno test --allow-env functions/_tests/
      - name: Push migrations
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('supabase/**') != '' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        working-directory: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --linked
